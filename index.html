<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c62"><title>9090 CARGO туршилт</title><style>
*{box-sizing:border-box}body{font:16px -apple-system,BlinkMacSystemFont,Arial;margin:0;background:#eef3f8;color:#17324c}header{background:#123c62;color:#fff;padding:26px 20px}h1{margin:0}small{opacity:.8}main{padding:16px;max-width:640px;margin:auto}.warn{background:#fff1cf;padding:12px;border-radius:10px;font-size:13px;margin-bottom:14px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}button{border:0;border-radius:10px;padding:12px;font-size:15px;font-weight:600;background:#dce8f2;color:#12416a}.active,.save{background:#1473bb;color:white}section{background:#fff;padding:16px;border-radius:14px}.hide{display:none}label{display:block;margin-top:12px;font-size:14px;font-weight:600}input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.item{padding:13px 0;border-bottom:1px solid #e2e8f0}.item:last-child{border:0}.sub{font-size:13px;color:#66788c;margin-top:4px}.pill{display:inline-block;border-radius:20px;background:#dceeff;padding:5px 9px;font-size:12px}.flex{display:flex;justify-content:space-between;gap:8px;align-items:center}.empty{text-align:center;padding:25px;color:#66788c}footer{text-align:center;font-size:12px;color:#66788c;padding:22px} .photo{max-width:110px;max-height:100px;object-fit:cover;border-radius:9px;margin-top:9px}.qrbox{padding:12px;background:#f5f9fd;border-radius:12px;margin-top:10px}.qrbox img{width:160px;height:160px;display:block;margin:8px auto}.hint{font-size:12px;color:#6b7d8e}</style></head>
<body><header><h1>🚚 9090 CARGO</h1><small>Өмнөговь • iPhone демо</small></header><main><div class="warn">⚠️ Демо админы товч нь жинхэнэ хамгаалалт биш. Энэ бол туршилтын дэлгэц. Бүртгэл зөвхөн энэ браузерт хадгалагдана. Бодит хүний нэр, утас, төлбөрийн мэдээлэл бүү оруулаарай.</div><div class="tabs"><button id="b1" class="active" onclick="tab(1)">Ачааны жагсаалт</button><button id="b2" onclick="tab(2)">+ Ачаа бүртгэх</button></div>
<section id="s1"><input id="search" placeholder="Ачааны код, бараагаар хайх" oninput="draw()"><div id="results"></div></section><section id="s2" class="hide"><form id="form"><label>Туршилтын нэр<input name="customer" placeholder="Жишээ: Туршилт 1" required maxlength="50"></label><label>Барааны нэр<input name="goods" placeholder="Жишээ: Хайрцаг" required maxlength="100"></label><label>Ширхэг<input name="pieces" type="number" min="1" value="1" required></label><label>Жин (кг)<input name="weight" type="number" min="0" step=".01"></label><label>Тээврийн төлбөр (¥, туршилт)<input name="fee" type="number" min="0" step=".01" placeholder="0"></label><label>Төлбөрийн төлөв<select name="payment"><option value="unpaid">Төлөөгүй</option><option value="partial">Хэсэгчлэн төлсөн</option><option value="paid">Бүрэн төлсөн</option></select></label><label>Машины дугаар<select name="truck"><option value="">Хуваарилаагүй</option><option>6361</option><option>8586</option><option>1005</option><option>6124</option><option>1864</option><option>7784</option></select></label><label>Ачааны зураг (iPhone камер)<input name="photo" type="file" accept="image/*" capture="environment"></label><label>Хүрэх газар<select name="destination"><option>Өмнөговь</option><option>Улаанбаатар</option><option>Дорнод</option><option>Сүхбаатар</option></select></label><p><button class="save" style="width:100%" type="submit">Бүртгэж хадгалах</button></p></form></section><footer>9090 CARGO • Зөвхөн демо • Сервергүй</footer></main>
<script>
const KEY='cargo9090_demo';let rows=[];try{rows=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
const states=['Эрээнд хүлээн авсан','Ачилтад хүлээж байна','Машинд ачсан','Монголд ирсэн','Хүлээлгэн өгсөн'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(e){alert('Браузерт хадгалж чадсангүй')}}
function tab(n){document.getElementById('s1').classList.toggle('hide',n!==1);document.getElementById('s2').classList.toggle('hide',n!==2);document.getElementById('b1').classList.toggle('active',n===1);document.getElementById('b2').classList.toggle('active',n===2);if(n===1)draw()}
function draw(){let q=document.getElementById('search').value.toLowerCase(),r=rows.filter(x=>(x.code+' '+x.goods+' '+x.customer).toLowerCase().includes(q));document.getElementById('results').innerHTML=r.length?r.map(x=>'<div class="item"><div class="flex"><strong>'+esc(x.code)+'</strong><span class="pill">'+esc(x.status)+'</span></div><div style="margin-top:8px">'+esc(x.goods)+' · '+esc(x.pieces)+' ш · '+esc(x.weight||0)+' кг</div><div class="sub">'+esc(x.customer)+' · '+esc(x.destination)+' · '+esc(x.date)+'</div><div class="sub">Машин: '+esc(x.truck||'Хуваарилаагүй')+' · ¥'+esc(x.fee||0)+' · '+esc(x.payment==='paid'?'Бүрэн төлсөн':x.payment==='partial'?'Хэсэгчлэн төлсөн':'Төлөөгүй')+(x.adminApproved?' · Демо зөвшөөрөлтэй':'')+'</div><p><button onclick="changePayment(\''+x.code+'\')">Төлбөр</button> <button onclick="approveDemo(\''+x.code+'\')">Демо админ</button></p>'+(x.photo?'<img class="photo" src="'+x.photo+'" alt="Ачааны зураг">':'')+'<div class="qrbox"><div class="hint">QR код • Ачааны кодыг уншуулахад ашиглана</div><img alt="QR код" loading="lazy" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(x.code)+'"><div class="hint">'+esc(x.code)+'</div></div><p><button onclick="advance(\''+x.code+'\')">Дараагийн төлөв</button> <button onclick="removeCargo(\''+x.code+'\')">Устгах</button></p></div>').join(''):'<div class="empty">Ачаа бүртгэгдээгүй байна</div>'}
function advance(id){let x=rows.find(r=>r.code===id);if(x){let i=states.indexOf(x.status);if(i===3&&x.payment!=='paid'&&!x.adminApproved){alert('Төлбөр төлөгдөөгүй тул хүлээлгэн өгөхийг хориглолоо. Туршилтын админ зөвшөөрөл шаардлагатай.');return}if(i<states.length-1)x.status=states[i+1];save();draw()}}
function changePayment(id){const x=rows.find(r=>r.code===id);if(!x)return;const v=prompt('Төлбөр: 0 = Төлөөгүй, 1 = Хэсэгчлэн, 2 = Бүрэн төлсөн',x.payment==='paid'?'2':x.payment==='partial'?'1':'0');if(!['0','1','2'].includes(v))return;x.payment=['unpaid','partial','paid'][Number(v)];x.adminApproved=false;save();draw()}
function approveDemo(id){const x=rows.find(r=>r.code===id);if(!x)return;if(confirm('ЗӨВХӨН ДЕМО: админы зөвшөөрлийг дуурайлган олгох уу? Энэ нь бодит нэвтрэлт, эрхийн хамгаалалт биш.')){x.adminApproved=true;save();draw()}}
function removeCargo(id){if(confirm('Энэ туршилтын ачааг устгах уу?')){rows=rows.filter(r=>r.code!==id);save();draw()}}
function compressPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.size)return resolve('');if(!file.type.startsWith('image/'))return reject(Error('Зураг сонгоно уу'));const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=700,ratio=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*ratio));c.height=Math.max(1,Math.round(img.height*ratio));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.55))};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('Зураг уншигдсангүй'))};img.src=url})}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const f=e.target,v=new FormData(f),btn=f.querySelector('[type=submit]');btn.disabled=true;try{const photo=await compressPhoto(v.get('photo'));const row={code:'C'+Date.now().toString(36).toUpperCase(),customer:v.get('customer'),goods:v.get('goods'),pieces:v.get('pieces'),weight:v.get('weight'),destination:v.get('destination'),status:states[0],fee:v.get('fee'),payment:v.get('payment'),truck:v.get('truck'),adminApproved:false,date:new Date().toLocaleDateString('mn-MN'),photo};rows.unshift(row);try{localStorage.setItem(KEY,JSON.stringify(rows))}catch(err){rows.shift();throw Error('Утасны хадгалах зай хүрэлцэхгүй байна. Жижиг зураг сонгоно уу.')};f.reset();tab(1)}catch(err){alert(err.message||'Бүртгэж чадсангүй')}finally{btn.disabled=false}};draw();
</script></body></html>
